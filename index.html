<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olivia's Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount:wght@100..900&family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="estilos/style.css">
</head>

<body>

    <div class="container">

        <header>
            
            <img src="imagens/header_brain_transp.png" alt="Cérebro em Pixel Art" class="pixel-brain">

            <div class="header-content"> 
                <h1>Olivia's Archive</h1>
            </div>

            <nav>
                <button class="aba ativa" data-pagina="inicio">Início</button>
                <button class="aba" data-pagina="rankings">Rankings</button>
                <button class="aba" data-pagina="sobre">Sobre</button>

                <button id="botao-coracao" class="mensagem-coracao">
                    <img src="imagens/coracao-branco-50px.png" alt="coração branco estilo pixel art">
                </button>
            </nav>
            <!-- aqui eu preciso por um botãozinho de coração ou estrela em pixel arte que ao clicar, abre um pop-up com uma pequena mensagem para quem quer que visualize esse mini projeto.-->

        </header>

        <main>
           
            <section id="inicio" class="pagina ativa"></section>
            <section id="rankings" class="pagina"></section>
            <section id="sobre" class="pagina"></section>
        </main>

    </div>

    <script src="script.js"></script>
</body>

</html>
